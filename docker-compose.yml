version: "3.9"

services:
  ollama-provider:
    image: ollama/ollama:latest
    container_name: veritas-ollama
    restart: unless-stopped
    ports:
      # Bind to localhost only — Ollama has no auth, do not expose it on
      # 0.0.0.0 where any host on the LAN could hit the inference endpoint.
      - "127.0.0.1:11434:11434"   # host:container, localhost-only
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts:/scripts:ro
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Auto-detects VRAM and pulls the optimal Gemma 4 variant on first boot.
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve & sleep 3 && /scripts/pull_optimal_gemma.sh && wait"

  veritas-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veritas-app
    depends_on:
      - ollama-provider
    environment:
      - OLLAMA_BASE_URL=http://ollama-provider:11434
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    volumes:
      # Read-only — the app never writes to its own source tree, and a
      # successful prompt-injection RCE chain must not be able to mutate
      # host files.
      - ./:/app:ro
    working_dir: /app
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["python", "demo.py"]

volumes:
  ollama_data:
